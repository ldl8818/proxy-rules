name: Compile owner rules
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owner-rules
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - name: Compile and publish the validated batch
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          python3 compile_rules.py
          git add -- generated/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TZ=Asia/Shanghai git commit -m 'chore: 编译业务联动规则'
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_sha" != "$source_sha" ]; then
            echo 'Newer source exists; its queued run will compile it.'
            exit 0
          fi
          git push origin HEAD:main
